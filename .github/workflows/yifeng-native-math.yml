name: Apply Yifeng native Word math

on:
  push:
    branches: [main]
    paths:
      - '.tmp_yifeng_native_math/run.py'

permissions:
  contents: write

jobs:
  patch-report:
    if: github.event.head_commit.message == 'Apply Yifeng native math rendering'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-docx==1.2.0
      - name: Convert display equations to native Word math
        run: python .tmp_yifeng_native_math/run.py
      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx"
          git diff --cached --quiet && exit 0
          git commit -m "Render Yifeng report equations with native Word math"
          git push
