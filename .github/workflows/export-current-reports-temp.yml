name: Export current reports (temporary)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-current-reports-temp.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload current reports
        uses: actions/upload-artifact@v4
        with:
          name: current-quantum-scattering-reports
          path: |
            Shufan ZHANG 999018435/quantum_scattering_report.docx
            Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx
          if-no-files-found: error
          retention-days: 1
