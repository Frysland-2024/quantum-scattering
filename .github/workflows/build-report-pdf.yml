name: Build report PDF

on:
  push:
    branches:
      - portfolio-cleanup
    paths:
      - "report/quantum_scattering_report.docx"
      - ".github/workflows/build-report-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-report-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-report-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer

      - name: Convert DOCX to PDF
        run: |
          mkdir -p /tmp/report-pdf
          libreoffice --headless --convert-to pdf --outdir /tmp/report-pdf report/quantum_scattering_report.docx
          cp /tmp/report-pdf/quantum_scattering_report.pdf report/quantum_scattering_report.pdf

      - name: Upload PDF for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: quantum-scattering-report-pdf
          path: report/quantum_scattering_report.pdf
          if-no-files-found: error

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/quantum_scattering_report.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
            exit 0
          fi
          git commit -m "Build PDF version of project report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
