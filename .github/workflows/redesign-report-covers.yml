name: Redesign report covers and renumber Yifeng sections

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/redesign-report-covers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx

      - name: Update both reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          from docx import Document
          from docx.enum.text import WD_ALIGN_PARAGRAPH, WD_BREAK
          from docx.oxml.ns import qn
          from docx.shared import Inches, Pt, RGBColor

          SHUFAN = Path("Shufan ZHANG 999018435/quantum_scattering_report.docx")
          YIFENG = Path("Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx")


          def media_hashes(path: Path) -> dict[str, str]:
              with ZipFile(path) as archive:
                  return {
                      name: hashlib.sha256(archive.read(name)).hexdigest()
                      for name in archive.namelist()
                      if name.startswith("word/media/")
                  }


          def clear_paragraph(paragraph) -> None:
              for child in list(paragraph._p):
                  if child.tag != qn("w:pPr"):
                      paragraph._p.remove(child)


          def set_single_run(
              paragraph,
              text: str,
              *,
              font: str,
              size: float,
              bold: bool = False,
              italic: bool = False,
              color: tuple[int, int, int] | None = None,
          ):
              clear_paragraph(paragraph)
              run = paragraph.add_run(text)
              run.font.name = font
              run._element.rPr.rFonts.set(qn("w:eastAsia"), font)
              run.font.size = Pt(size)
              run.bold = bold
              run.italic = italic
              if color is not None:
                  run.font.color.rgb = RGBColor(*color)
              return run


          def remove_paragraph(paragraph) -> None:
              paragraph._element.getparent().remove(paragraph._element)


          def update_shufan() -> None:
              before_media = media_hashes(SHUFAN)
              doc = Document(SHUFAN)
              original_modified_by = doc.core_properties.last_modified_by
              paragraphs = doc.paragraphs
              body_start = next(
                  i for i, paragraph in enumerate(paragraphs)
                  if paragraph.text.strip().startswith("1. Part 1")
              )
              before_body = [paragraph.text for paragraph in paragraphs[body_start:]]
              if body_start < 4:
                  raise RuntimeError("Unexpected Shufan cover structure")

              p0, p1, p2, p3 = paragraphs[:4]
              set_single_run(
                  p0,
                  "QUANTUM SCATTERING REPORT",
                  font="Liberation Sans",
                  size=28,
                  bold=True,
                  color=(0x17, 0x36, 0x5D),
              )
              p0.alignment = WD_ALIGN_PARAGRAPH.CENTER
              p0.paragraph_format.space_before = Pt(72)
              p0.paragraph_format.space_after = Pt(0)
              p0.paragraph_format.line_spacing = 1.0

              set_single_run(
                  p1,
                  "Numerical Study of One-Dimensional\nScattering and Resonance States",
                  font="Liberation Serif",
                  size=16,
                  italic=True,
                  color=(0x59, 0x59, 0x59),
              )
              p1.alignment = WD_ALIGN_PARAGRAPH.CENTER
              p1.paragraph_format.space_before = Pt(18)
              p1.paragraph_format.space_after = Pt(0)
              p1.paragraph_format.line_spacing = 1.1

              set_single_run(
                  p2,
                  "Shufan ZHANG",
                  font="Liberation Serif",
                  size=24,
              )
              p2.alignment = WD_ALIGN_PARAGRAPH.CENTER
              p2.paragraph_format.space_before = Pt(132)
              p2.paragraph_format.space_after = Pt(0)

              set_single_run(
                  p3,
                  "Student ID: 999018435",
                  font="Liberation Serif",
                  size=15,
                  color=(0x40, 0x40, 0x40),
              )
              p3.alignment = WD_ALIGN_PARAGRAPH.CENTER
              p3.paragraph_format.space_before = Pt(12)
              p3.paragraph_format.space_after = Pt(0)
              p3.add_run().add_break(WD_BREAK.PAGE)

              for paragraph in list(doc.paragraphs[4:body_start]):
                  remove_paragraph(paragraph)

              doc.core_properties.author = "Shufan ZHANG"
              doc.core_properties.last_modified_by = original_modified_by
              doc.save(SHUFAN)

              check = Document(SHUFAN)
              check_start = next(
                  i for i, paragraph in enumerate(check.paragraphs)
                  if paragraph.text.strip().startswith("1. Part 1")
              )
              if [paragraph.text for paragraph in check.paragraphs[check_start:]] != before_body:
                  raise RuntimeError("Shufan body text changed unexpectedly")
              if len(check.inline_shapes) != 25:
                  raise RuntimeError("Shufan image count changed")
              if media_hashes(SHUFAN) != before_media:
                  raise RuntimeError("Shufan embedded images changed")
              if [paragraph.text for paragraph in check.paragraphs[:4]] != [
                  "QUANTUM SCATTERING REPORT",
                  "Numerical Study of One-Dimensional\nScattering and Resonance States",
                  "Shufan ZHANG",
                  "Student ID: 999018435",
              ]:
                  raise RuntimeError("Shufan cover validation failed")


          def replace_text_in_runs(paragraph, replacements) -> None:
              for run in paragraph.runs:
                  text = run.text
                  for old, new in replacements:
                      text = text.replace(old, new)
                  if text != run.text:
                      run.text = text


          def update_yifeng() -> None:
              before_media = media_hashes(YIFENG)
              before_doc = Document(YIFENG)
              before_body_paragraphs = before_doc.paragraphs[4:]
              roman = {"1": "I", "2": "II", "3": "III", "4": "IV", "5": "V", "6": "VI"}
              expected_body: list[str] = []
              for paragraph in before_body_paragraphs:
                  text = paragraph.text
                  for number, numeral in roman.items():
                      text = text.replace(f"Part {number}", f"Part {numeral}")
                  if (
                      paragraph.style.name == "Heading 2"
                      and len(text) >= 3
                      and text[0] in roman
                      and text[1] == "."
                      and text[2].isdigit()
                  ):
                      text = roman[text[0]] + text[1:]
                  expected_body.append(text)

              doc = Document(YIFENG)
              paragraphs = doc.paragraphs
              if len(paragraphs) < 5 or not paragraphs[4].text.startswith("Part 1"):
                  raise RuntimeError("Unexpected Yifeng cover structure")
              p0, p1, p2, p3 = paragraphs[:4]

              set_single_run(
                  p0,
                  "ONE-DIMENSIONAL\nQUANTUM SCATTERING",
                  font="Aptos Display",
                  size=28,
                  bold=True,
                  color=(0x1F, 0x4E, 0x79),
              )
              p0.alignment = WD_ALIGN_PARAGRAPH.LEFT
              p0.paragraph_format.left_indent = Inches(0.55)
              p0.paragraph_format.space_before = Pt(105)
              p0.paragraph_format.space_after = Pt(10)
              p0.paragraph_format.line_spacing = 1.0

              set_single_run(
                  p1,
                  "Computational Project Report",
                  font="Aptos",
                  size=15,
                  color=(0x4F, 0x81, 0xBD),
              )
              p1.alignment = WD_ALIGN_PARAGRAPH.LEFT
              p1.paragraph_format.left_indent = Inches(0.55)
              p1.paragraph_format.space_before = Pt(0)
              p1.paragraph_format.space_after = Pt(0)

              set_single_run(
                  p2,
                  "Yifeng CHEN",
                  font="Aptos",
                  size=16,
                  bold=True,
              )
              p2.alignment = WD_ALIGN_PARAGRAPH.LEFT
              p2.paragraph_format.left_indent = Inches(0.55)
              p2.paragraph_format.space_before = Pt(188)
              p2.paragraph_format.space_after = Pt(2)

              set_single_run(
                  p3,
                  "Student ID: 999016959",
                  font="Aptos",
                  size=11,
                  color=(0x40, 0x40, 0x40),
              )
              p3.alignment = WD_ALIGN_PARAGRAPH.LEFT
              p3.paragraph_format.left_indent = Inches(0.55)
              p3.paragraph_format.space_before = Pt(4)
              p3.paragraph_format.space_after = Pt(0)
              p3.add_run().add_break(WD_BREAK.PAGE)

              replacements = [
                  ("Part 1", "Part I"),
                  ("Part 2", "Part II"),
                  ("Part 3", "Part III"),
                  ("Part 4", "Part IV"),
                  ("Part 5", "Part V"),
                  ("Part 6", "Part VI"),
              ]
              for paragraph in doc.paragraphs[4:]:
                  replace_text_in_runs(paragraph, replacements)

              for paragraph in doc.paragraphs[4:]:
                  if paragraph.style.name == "Heading 2":
                      text = paragraph.text
                      if len(text) >= 3 and text[0] in roman and text[1] == "." and text[2].isdigit():
                          clear_paragraph(paragraph)
                          paragraph.add_run(roman[text[0]] + text[1:])

              doc.core_properties.author = "Yifeng CHEN"
              doc.core_properties.last_modified_by = "cuifa01"
              doc.save(YIFENG)

              check = Document(YIFENG)
              actual_body = [paragraph.text for paragraph in check.paragraphs[4:]]
              if actual_body != expected_body:
                  raise RuntimeError("Yifeng text changed outside the intended renumbering")
              if len(check.inline_shapes) != 26:
                  raise RuntimeError("Yifeng image count changed")
              if media_hashes(YIFENG) != before_media:
                  raise RuntimeError("Yifeng embedded images changed")
              if check.core_properties.author != "Yifeng CHEN":
                  raise RuntimeError("Yifeng creator metadata changed")
              if check.core_properties.last_modified_by != "cuifa01":
                  raise RuntimeError("Yifeng lastModifiedBy metadata changed")
              if [paragraph.text for paragraph in check.paragraphs[:4]] != [
                  "ONE-DIMENSIONAL\nQUANTUM SCATTERING",
                  "Computational Project Report",
                  "Yifeng CHEN",
                  "Student ID: 999016959",
              ]:
                  raise RuntimeError("Yifeng cover validation failed")
              for paragraph in check.paragraphs[4:]:
                  if any(f"Part {number}" in paragraph.text for number in range(1, 7)):
                      raise RuntimeError(f"Arabic Part reference remains: {paragraph.text}")


          update_shufan()
          update_yifeng()
          print("Both reports updated and validated.")
          PY

      - name: Upload updated reports for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: redesigned-reports
          path: |
            Shufan ZHANG 999018435/quantum_scattering_report.docx
            Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx
          retention-days: 1

      - name: Commit reports and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/redesign-report-covers.yml"
          git add \
            "Shufan ZHANG 999018435/quantum_scattering_report.docx" \
            "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx"
          git commit -m "Redesign report covers and use Roman sections for Yifeng"
          git push
