name: Numerical smoke test

on:
  push:
    branches:
      - portfolio-cleanup
      - main
    paths:
      - "code/**"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: pip install -r code/requirements.txt

      - name: Compile source tree
        run: python -m compileall -q code

      - name: Check stationary-scattering solver
        working-directory: code
        run: |
          python - <<'PY'
          import numpy as np
          from quantum_scattering.scattering import appendix_v_scan

          energies = np.array([0.40, 0.621, 1.33])
          result = appendix_v_scan(energies, dx=0.01)
          transmission = np.abs(result.T) ** 2

          assert np.all(np.isfinite(transmission))
          assert np.all(transmission >= 0.0)
          assert np.all(transmission <= 1.01)
          assert transmission[1] > transmission[0]
          print("Transmission probabilities:", transmission)
          PY
