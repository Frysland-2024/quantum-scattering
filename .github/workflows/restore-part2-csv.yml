name: Restore Part 2 CSV outputs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-part2-csv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore both Part 2 CSV-generation paths
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT="a989083aaccc9ac27b358a701668dc765a8880a7"

          git show "$OLD_COMMIT:Shufan ZHANG 999018435/codes and figures/part2_regularized_delta.py" \
            > "Shufan ZHANG 999018435/codes and figures/part2_regularized_delta.py"

          git show "$OLD_COMMIT:Yifeng CHEN 999016959/Codes and Figures/part2.py" \
            > "Yifeng CHEN 999016959/Codes and Figures/part2.py"

          git show "$OLD_COMMIT:Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/delta.py" \
            > "Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/delta.py"

          python - <<'PY'
          from pathlib import Path
          import subprocess

          old_commit = "a989083aaccc9ac27b358a701668dc765a8880a7"
          path = "Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/figures.py"
          current = Path(path).read_text(encoding="utf-8")
          old = subprocess.check_output(
              ["git", "show", f"{old_commit}:{path}"],
              text=True,
          )

          start_marker = "def generate_part2("
          end_marker = "\ndef _continuum_figure("
          old_start = old.index(start_marker)
          old_end = old.index(end_marker, old_start)
          current_start = current.index(start_marker)
          current_end = current.index(end_marker, current_start)

          restored = current[:current_start] + old[old_start:old_end] + current[current_end:]
          if "\nimport csv\n" not in restored:
              restored = restored.replace(
                  "from __future__ import annotations\n",
                  "from __future__ import annotations\n\nimport csv\n",
                  1,
              )
          Path(path).write_text(restored, encoding="utf-8")
          PY

          mkdir -p \
            "Shufan ZHANG 999018435/codes and figures/outputs/part2" \
            "Yifeng CHEN 999016959/Codes and Figures/output/part2_regularized_delta"

          git show "$OLD_COMMIT:Shufan ZHANG 999018435/codes and figures/outputs/part2/part2_delta_test.csv" \
            > "Shufan ZHANG 999018435/codes and figures/outputs/part2/part2_delta_test.csv"

          git show "$OLD_COMMIT:Yifeng CHEN 999016959/Codes and Figures/output/part2_regularized_delta/delta_convergence.csv" \
            > "Yifeng CHEN 999016959/Codes and Figures/output/part2_regularized_delta/delta_convergence.csv"

          git rm ".github/workflows/restore-part2-csv.yml"

      - name: Compile and verify restoration
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures"

          grep -q "part2_delta_test.csv" \
            "Shufan ZHANG 999018435/codes and figures/part2_regularized_delta.py"
          grep -q "delta_convergence.csv" \
            "Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/figures.py"
          grep -q "grid_step" \
            "Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/delta.py"

          test -s "Shufan ZHANG 999018435/codes and figures/outputs/part2/part2_delta_test.csv"
          test -s "Yifeng CHEN 999016959/Codes and Figures/output/part2_regularized_delta/delta_convergence.csv"

          find \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures" \
            -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit restored Part 2 CSV support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore required Part 2 CSV outputs"
          git push
