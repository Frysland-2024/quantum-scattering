name: Finalize Part 6 reports

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-part6-reports.yml"
      - ".github/scripts/finalize_part6.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document dependency
        run: python -m pip install "python-docx>=1.1,<2"

      - name: Append Part 6 and clean Yifeng outputs
        run: python .github/scripts/finalize_part6.py

      - name: Validate generated files
        run: |
          python -m py_compile \
            "Yifeng CHEN 999016959/Codes and Figures/part6.py" \
            "Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/complex_scaling.py"
          unzip -t "Shufan ZHANG 999018435/quantum_scattering_report.docx"
          unzip -t "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx"
          test ! -e "Yifeng CHEN 999016959/Codes and Figures/output/part6_complex_scaling/part6_diagnostics.json"
          test ! -e "Yifeng CHEN 999016959/Codes and Figures/output/part6_complex_scaling/part6_manifest.json"

      - name: Commit finalized reports and code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Shufan ZHANG 999018435/quantum_scattering_report.docx" \
            "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx" \
            "Yifeng CHEN 999016959/Codes and Figures/part6.py" \
            "Yifeng CHEN 999016959/Codes and Figures/src/quantum_scattering/complex_scaling.py"
          git add -A -- "Yifeng CHEN 999016959/Codes and Figures/output/part6_complex_scaling"
          if ! git diff --cached --quiet; then
            git commit -m "Complete Part 6 reports and keep Yifeng outputs image-only"
            git push
          fi
