name: Patch Yifeng report

on:
  push:
    branches: [main]
    paths:
      - '.tmp_yifeng_report_patch/run.py'

permissions:
  contents: write

jobs:
  patch-report:
    if: github.event.head_commit.message == 'Trigger Yifeng report patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch DOCX
        run: python .tmp_yifeng_report_patch/run.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx"
          git diff --cached --quiet && exit 0
          git commit -m "Revise Yifeng report Part 1 and Part 2 theory"
          git push
