name: Apply Shufan wording differentiation

on:
  push:
    branches: [main]
    paths:
      - '.tmp_shufan_wording_diff/run.py'

permissions:
  contents: write

jobs:
  patch-report:
    if: github.event.head_commit.message == 'Apply Shufan wording differentiation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install python-docx==1.2.0
      - name: Differentiate Part 1 and Part 2 wording
        run: python .tmp_shufan_wording_diff/run.py
      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Shufan ZHANG 999018435/quantum_scattering_report.docx"
          git diff --cached --quiet && exit 0
          git commit -m "Differentiate Shufan Part 1 and Part 2 wording"
          git push
