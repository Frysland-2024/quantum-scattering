name: Finalize code cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-code-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply reviewed source cleanup
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/cleanup/patch.00part0 \
            .github/cleanup/patch.00part1 \
            .github/cleanup/patch.01 \
            .github/cleanup/patch.02 \
            .github/cleanup/patch.03 \
            | base64 -d | gzip -d > /tmp/code-cleanup.patch
          echo "cd72566096fafe7bee579a08366d0dcd6f3db4f7e5c7b76212173e8163040287  /tmp/code-cleanup.patch" | sha256sum -c -
          git apply --check /tmp/code-cleanup.patch
          git apply /tmp/code-cleanup.patch

      - name: Remove obsolete generated metadata and temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            ".github/cleanup/patch.00" \
            ".github/cleanup/patch.00part0" \
            ".github/cleanup/patch.00part1" \
            ".github/cleanup/patch.01" \
            ".github/cleanup/patch.02" \
            ".github/cleanup/patch.03" \
            ".github/workflows/apply-code-cleanup.yml" \
            ".github/workflows/audit-codebase.yml" \
            ".github/workflows/finalize-code-cleanup.yml" \
            ".github/workflows/generate-part6-wavefunctions.yml" \
            "Shufan ZHANG 999018435/codes and figures/outputs/part2/part2_delta_test.csv" \
            "Yifeng CHEN 999016959/Codes and Figures/output/part2_regularized_delta/delta_convergence.csv"

      - name: Validate cleaned codebases
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures"
          find \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures" \
            -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(find \
            'Shufan ZHANG 999018435/codes and figures/outputs' \
            'Yifeng CHEN 999016959/Codes and Figures/output' \
            -type f ! -iname '*.png' ! -iname '*.gif' -print -quit)"
          ! grep -RInE \
            'part3_peak_summary|part6_diagnostics|part6_manifest|delta_convergence\.csv|part2_delta_test\.csv|cleanup_non_deliverables|clean_old_metadata' \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures"

      - name: Commit cleaned code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove redundant non-figure code"
          git push
