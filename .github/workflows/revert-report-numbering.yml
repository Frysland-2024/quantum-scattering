name: Simplify report covers and restore Arabic numbering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/revert-report-numbering.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Edit the two reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import os
          import tempfile
          import xml.etree.ElementTree as ET

          W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'
          CP = 'http://schemas.openxmlformats.org/package/2006/metadata/core-properties'
          ET.register_namespace('w', W)

          def paragraph_text(paragraph):
              chunks = []
              for node in paragraph.iter():
                  if node.tag == f'{{{W}}}t' and node.text:
                      chunks.append(node.text)
                  elif node.tag == f'{{{W}}}br':
                      chunks.append('\n')
              return ''.join(chunks)

          def rewrite_docx(path, new_document_xml):
              with ZipFile(path, 'r') as source:
                  infos = source.infolist()
                  contents = {info.filename: source.read(info.filename) for info in infos}
              contents['word/document.xml'] = new_document_xml
              handle, temp_name = tempfile.mkstemp(prefix=path.stem + '_', suffix='.docx', dir=path.parent)
              os.close(handle)
              temporary = Path(temp_name)
              try:
                  with ZipFile(temporary, 'w') as destination:
                      for info in infos:
                          destination.writestr(info, contents[info.filename])
                  temporary.replace(path)
              finally:
                  temporary.unlink(missing_ok=True)

          def set_paragraph_text(paragraph, new_text):
              text_nodes = list(paragraph.iter(f'{{{W}}}t'))
              if not text_nodes:
                  raise RuntimeError('Target paragraph has no text nodes')
              text_nodes[0].text = new_text
              for node in text_nodes[1:]:
                  node.text = ''
              for parent in paragraph.iter():
                  for child in list(parent):
                      if child.tag == f'{{{W}}}br':
                          parent.remove(child)

          shufan = Path('Shufan ZHANG 999018435/quantum_scattering_report.docx')
          with ZipFile(shufan, 'r') as source:
              shufan_root = ET.fromstring(source.read('word/document.xml'))
          shufan_body = shufan_root.find(f'{{{W}}}body')
          if shufan_body is None:
              raise RuntimeError('Shufan document body not found')
          removed = 0
          for child in list(shufan_body):
              if child.tag != f'{{{W}}}p':
                  continue
              text = paragraph_text(child)
              if 'Numerical Study of One-Dimensional' in text and 'Scattering and Resonance States' in text:
                  shufan_body.remove(child)
                  removed += 1
          if removed != 1:
              raise RuntimeError(f'Expected one Shufan subtitle, removed {removed}')
          shufan_xml = ET.tostring(shufan_root, encoding='utf-8', xml_declaration=True)
          if hashlib.sha256(shufan_xml).hexdigest() != 'f52a5a48c6dbcc3adba180f29e9b87b20e9beafa2092d884be413772468f2912':
              raise RuntimeError('Unexpected Shufan document XML after edit')
          rewrite_docx(shufan, shufan_xml)

          headings = {
              'Part I — Free Gaussian wave packet': 'Part 1 — Free Gaussian wave packet',
              'I.1 Changing the width': '1.1 Changing the width',
              'I.2 Changing the mean momentum': '1.2 Changing the mean momentum',
              'I.3 Free propagation': '1.3 Free propagation',
              'Part II — Regularized Dirac delta function': 'Part 2 — Regularized Dirac delta function',
              'Part III — Stationary scattering and resonances': 'Part 3 — Stationary scattering and resonances',
              'III.1 Resonance peaks': '3.1 Resonance peaks',
              'III.2 Continuum wave functions around the two resonance peaks': '3.2 Continuum wave functions around the two resonance peaks',
              'Part IV — Time-dependent scattering wave packets': 'Part 4 — Time-dependent scattering wave packets',
              'IV.1 Blocked': '4.1 Blocked',
              'IV.2 Partially blocked': '4.2 Partially blocked',
              'IV.3 Pass': '4.3 Pass',
              'IV.4 Narrow packet around the first resonance': '4.4 Narrow packet around the first resonance',
              'IV.5 Narrow packet around the second resonance': '4.5 Narrow packet around the second resonance',
              'Part V — Box-basis matrix calculation': 'Part 5 — Box-basis matrix calculation',
              'V.1 Harmonic-oscillator validation': '5.1 Harmonic-oscillator validation',
              'V.2 First 11 short-range eigenstates': '5.2 First 11 short-range eigenstates',
              'V.3 All box states': '5.3 All box states',
              'V.4 Bound state and box states near the resonances': '5.4 Bound state and box states near the resonances',
              'Part VI — Resonance poles from complex scaling': 'Part 6 — Resonance poles from complex scaling',
              'VI.1 Rotated continuum and stationary poles': '6.1 Rotated continuum and stationary poles',
              'VI.2 Transmission curves reconstructed from the poles': '6.2 Transmission curves reconstructed from the poles',
              'VI.3 What the rotation does to the wave function': '6.3 What the rotation does to the wave function',
              'VI.4 Check against the Part III peak positions': '6.4 Check against the Part 3 peak positions',
          }
          crossrefs = [
              ('Part VI', 'Part 6'),
              ('Part V', 'Part 5'),
              ('Part IV', 'Part 4'),
              ('Part III', 'Part 3'),
              ('Part II', 'Part 2'),
              ('Part I', 'Part 1'),
          ]

          yifeng = Path('Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx')
          with ZipFile(yifeng, 'r') as source:
              yifeng_root = ET.fromstring(source.read('word/document.xml'))
              yifeng_core = source.read('docProps/core.xml')
          yifeng_body = yifeng_root.find(f'{{{W}}}body')
          if yifeng_body is None:
              raise RuntimeError('Yifeng document body not found')
          paragraphs = [p for p in list(yifeng_body) if p.tag == f'{{{W}}}p']
          if not paragraphs:
              raise RuntimeError('Yifeng document has no paragraphs')

          title = paragraph_text(paragraphs[0])
          if 'ONE-DIMENSIONAL' not in title or 'QUANTUM SCATTERING' not in title:
              raise RuntimeError(f'Unexpected Yifeng cover title: {title!r}')
          set_paragraph_text(paragraphs[0], 'QUANTUM SCATTERING')

          heading_count = 0
          crossref_count = 0
          for paragraph in paragraphs[1:]:
              text = paragraph_text(paragraph)
              if text in headings:
                  set_paragraph_text(paragraph, headings[text])
                  heading_count += 1
                  continue
              for node in paragraph.iter(f'{{{W}}}t'):
                  if not node.text:
                      continue
                  original = node.text
                  updated = original
                  for old, new in crossrefs:
                      updated = updated.replace(old, new)
                  if updated != original:
                      for old, _ in crossrefs:
                          crossref_count += original.count(old)
                      node.text = updated

          if heading_count != len(headings):
              raise RuntimeError(f'Changed {heading_count} Yifeng headings; expected {len(headings)}')
          if crossref_count < 10:
              raise RuntimeError(f'Changed only {crossref_count} Yifeng cross-references')

          yifeng_xml = ET.tostring(yifeng_root, encoding='utf-8', xml_declaration=True)
          if hashlib.sha256(yifeng_xml).hexdigest() != 'f23a20a58a23d34eedbbfc4c5d4c59e9e8cd05435d23a05bc3dcc5e2fd533266':
              raise RuntimeError('Unexpected Yifeng document XML after edit')

          core_root = ET.fromstring(yifeng_core)
          modified_by = core_root.find(f'{{{CP}}}lastModifiedBy')
          if modified_by is None or modified_by.text != 'cuifa01':
              raise RuntimeError('Yifeng lastModifiedBy is not cuifa01')
          rewrite_docx(yifeng, yifeng_xml)

          print('Reports updated and validated.')
          PY

      - name: Commit reports and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/revert-report-numbering.yml"
          git add \
            "Shufan ZHANG 999018435/quantum_scattering_report.docx" \
            "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx"
          git commit -m "Simplify covers and restore Yifeng Arabic numbering"
          git push
