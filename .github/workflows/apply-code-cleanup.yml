name: Apply audited code cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-code-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cleanup/patch.* > /tmp/code_cleanup_patch.b64
          test "$(wc -c < /tmp/code_cleanup_patch.b64)" -eq 26348
          base64 -d /tmp/code_cleanup_patch.b64 > /tmp/code_cleanup.patch.gz
          echo "0499f07f1bd44f4ca9681f860a26dc5e0e0c38d732cd9a2fa24812293feb0200  /tmp/code_cleanup.patch.gz" | sha256sum -c -
          gzip -dc /tmp/code_cleanup.patch.gz > /tmp/code_cleanup.patch
          echo "cd72566096fafe7bee579a08366d0dcd6f3db4f7e5c7b76212173e8163040287  /tmp/code_cleanup.patch" | sha256sum -c -

      - name: Apply cleaned source files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/code_cleanup.patch
          git apply /tmp/code_cleanup.patch

      - name: Remove obsolete non-figure files and one-off automation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".github/cleanup"
          rm -f \
            ".github/workflows/apply-code-cleanup.yml" \
            ".github/workflows/audit-codebase.yml" \
            ".github/workflows/generate-part6-wavefunctions.yml" \
            "Shufan ZHANG 999018435/codes and figures/outputs/part2/part2_delta_test.csv" \
            "Yifeng CHEN 999016959/Codes and Figures/output/part2_regularized_delta/delta_convergence.csv"

      - name: Compile-check both codebases
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures"
          find \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures" \
            -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify figure-only deliverables and stale-code removal
        shell: bash
        run: |
          set -euo pipefail
          if find \
            "Shufan ZHANG 999018435/codes and figures/outputs" \
            "Yifeng CHEN 999016959/Codes and Figures/output" \
            -type f ! -iname '*.png' ! -iname '*.gif' -print -quit | grep -q .; then
            echo "Non-image output files remain:" >&2
            find \
              "Shufan ZHANG 999018435/codes and figures/outputs" \
              "Yifeng CHEN 999016959/Codes and Figures/output" \
              -type f ! -iname '*.png' ! -iname '*.gif' -print >&2
            exit 1
          fi
          if grep -RInE \
            'part3_peak_summary|part6_diagnostics|part6_manifest|delta_convergence\.csv|part2_delta_test\.csv|cleanup_non_deliverables|clean_old_metadata' \
            "Shufan ZHANG 999018435/codes and figures" \
            "Yifeng CHEN 999016959/Codes and Figures"; then
            echo "Stale cleanup or metadata code remains." >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove redundant non-figure code"
            git push
          fi
