name: Package current reports for review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-current-reports.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package reports
        run: |
          zip -j current-reports.zip \
            "Shufan ZHANG 999018435/quantum_scattering_report.docx" \
            "Yifeng CHEN 999016959/Quantum_Scattering_Project_Report.docx"
      - uses: actions/upload-artifact@v4
        with:
          name: current-reports
          path: current-reports.zip
          retention-days: 1
