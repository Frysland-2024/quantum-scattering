<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Numerical Quantum Scattering in 1D</title>
  <desc id="desc">Portfolio cover showing a Gaussian wave packet scattering from a double barrier, two transmission resonances, and resonance poles in the complex energy plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#091827"/>
      <stop offset="1" stop-color="#020811"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0f2940" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00040a" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glowC" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowO" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 58px; fill: #f3f7fb; letter-spacing: 0.5px; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #8fe9ff; letter-spacing: 2px; }
      .kicker { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #7e9ab2; letter-spacing: 3px; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #dceaf5; letter-spacing: 2.5px; font-weight: 600; }
      .small { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; fill: #9fb4c7; font-style: italic; }
      .label { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; fill: #e8f4fa; font-style: italic; }
      .axis { stroke: #c9d6df; stroke-width: 1.2; opacity: 0.9; }
      .grid { stroke: #385065; stroke-width: 0.7; opacity: 0.32; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#vignette)"/>

  <path d="M0 520 C120 485 200 550 315 510 C430 470 520 535 650 505 C770 477 860 535 985 500 C1070 476 1140 486 1200 506" fill="none" stroke="#0e83ad" stroke-width="1.2" opacity="0.35"/>
  <path d="M0 538 C125 500 215 570 330 530 C450 488 545 560 660 525 C800 483 875 558 1010 515 C1090 490 1145 505 1200 520" fill="none" stroke="#ff9b38" stroke-width="1" opacity="0.25"/>
  <g opacity="0.22" fill="#5bdcff">
    <circle cx="60" cy="532" r="1.4"/><circle cx="95" cy="524" r="1.3"/><circle cx="132" cy="526" r="1.2"/><circle cx="171" cy="536" r="1.2"/><circle cx="210" cy="542" r="1.1"/>
    <circle cx="382" cy="515" r="1.2"/><circle cx="430" cy="505" r="1.2"/><circle cx="476" cy="508" r="1.2"/><circle cx="520" cy="520" r="1.1"/>
    <circle cx="708" cy="512" r="1.2"/><circle cx="755" cy="505" r="1.2"/><circle cx="805" cy="510" r="1.2"/><circle cx="855" cy="522" r="1.1"/>
    <circle cx="1010" cy="511" r="1.2"/><circle cx="1055" cy="501" r="1.2"/><circle cx="1102" cy="502" r="1.2"/><circle cx="1150" cy="511" r="1.1"/>
  </g>

  <text x="600" y="70" text-anchor="middle" class="title">Numerical Quantum Scattering in 1D</text>
  <text x="600" y="105" text-anchor="middle" class="subtitle">TRANSMISSION RESONANCES · WAVE-PACKET DYNAMICS · COMPLEX SCALING</text>
  <line x1="75" y1="128" x2="1125" y2="128" stroke="#5e829c" stroke-width="1" opacity="0.45"/>

  <!-- 01: wave-packet scattering -->
  <text x="55" y="165" class="section">01 · WAVE-PACKET SCATTERING</text>
  <text x="55" y="190" class="small">Gaussian packet incident on a short-ranged double barrier</text>
  <line x1="50" y1="365" x2="395" y2="365" class="axis"/>
  <polygon points="395,365 386,360 386,370" fill="#c9d6df"/>
  <text x="391" y="388" class="label">x</text>

  <path d="M55 365 C85 365 88 316 118 278 C145 245 172 298 196 330 C213 352 226 365 244 365" fill="none" stroke="#4ddcff" stroke-width="2.5" opacity="0.75" filter="url(#glowC)"/>
  <path d="M57 365 C70 359 77 349 85 341 C94 332 99 329 105 341 C112 357 116 383 121 387 C126 391 131 353 136 328 C141 302 146 285 151 286 C157 287 162 310 167 338 C172 365 177 382 182 381 C188 380 194 352 201 337 C208 321 215 325 222 339 C229 353 236 363 244 365" fill="none" stroke="#a9f4ff" stroke-width="1.35" opacity="0.95"/>
  <text x="122" y="250" class="label">ψ(x,t)</text>
  <line x1="210" y1="278" x2="250" y2="278" stroke="#8eeaff" stroke-width="1.6"/>
  <polygon points="252,278 244,273 244,283" fill="#8eeaff"/>

  <!-- double barrier with central well -->
  <path d="M250 365
           C262 364 270 355 276 338
           C282 320 286 269 295 250
           C300 239 305 245 309 263
           C313 284 312 322 319 340
           C324 353 331 358 337 354
           C343 350 346 330 350 305
           C354 276 358 249 365 244
           C372 240 377 265 381 294
           C385 323 387 351 395 365"
        fill="none" stroke="#ffb052" stroke-width="2.5" filter="url(#glowO)"/>
  <text x="67" y="427" class="label">V(x) = (0.5x² − 0.8)e<tspan baseline-shift="super" font-size="11">−0.1x²</tspan></text>

  <!-- 02: transmission resonances -->
  <text x="428" y="165" class="section">02 · TRANSMISSION RESONANCES</text>
  <text x="428" y="190" class="small">Energy-dependent transmission probability</text>
  <rect x="430" y="220" width="360" height="205" rx="3" fill="#04101a" stroke="#7591a6" stroke-width="1" opacity="0.94"/>
  <line x1="470" y1="390" x2="758" y2="390" class="axis"/>
  <line x1="470" y1="390" x2="470" y2="245" class="axis"/>
  <line x1="470" y1="350" x2="758" y2="350" class="grid"/>
  <line x1="470" y1="310" x2="758" y2="310" class="grid"/>
  <line x1="470" y1="270" x2="758" y2="270" class="grid"/>
  <path d="M470 385 C500 383 515 379 535 376 C552 373 563 370 572 359 C582 345 585 325 590 282 C592 260 596 250 601 282 C606 318 607 345 618 360 C631 377 647 381 665 380 C681 378 695 372 705 360 C716 346 720 320 725 287 C728 270 732 259 736 288 C742 326 746 350 757 364" fill="none" stroke="#48d9ff" stroke-width="2.5" filter="url(#glowC)"/>
  <circle cx="600" cy="266" r="5" fill="#ffb34f" filter="url(#glowO)"/>
  <circle cx="734" cy="274" r="5" fill="#ffb34f" filter="url(#glowO)"/>
  <text x="567" y="247" fill="#ffc36f" font-family="Georgia,serif" font-size="15">E₁ ≈ 0.621</text>
  <text x="700" y="255" fill="#ffc36f" font-family="Georgia,serif" font-size="15">E₂ ≈ 1.33</text>
  <text x="605" y="414" text-anchor="middle" class="label">E</text>
  <text x="448" y="320" transform="rotate(-90 448 320)" text-anchor="middle" class="label">|T(E)|²</text>
  <text x="612" y="452" text-anchor="middle" class="small">Resonant tunnelling through a double barrier</text>

  <!-- 03: complex energy plane -->
  <text x="835" y="165" class="section">03 · COMPLEX ENERGY PLANE</text>
  <text x="835" y="190" class="small">Resonance poles exposed by complex scaling</text>
  <line x1="895" y1="350" x2="1135" y2="350" class="axis"/>
  <line x1="1005" y1="410" x2="1005" y2="230" class="axis"/>
  <polygon points="1136,350 1127,345 1127,355" fill="#c9d6df"/>
  <polygon points="1005,229 1000,238 1010,238" fill="#c9d6df"/>
  <text x="1112" y="374" class="label">Re(E)</text>
  <text x="1017" y="245" class="label">Im(E)</text>
  <path d="M1005 350 L1118 410" stroke="#49d9ff" stroke-width="2.3" opacity="0.85" filter="url(#glowC)"/>
  <path d="M1005 350 L1090 394" stroke="#49d9ff" stroke-width="1" stroke-dasharray="5 5" opacity="0.65"/>
  <text x="892" y="307" fill="#64dff9" font-family="Georgia,serif" font-size="14" font-style="italic">rotated continuum</text>
  <circle cx="965" cy="382" r="5.5" fill="#ffb34f" filter="url(#glowO)"/>
  <circle cx="1057" cy="392" r="5.5" fill="#ffb34f" filter="url(#glowO)"/>
  <text x="946" y="407" fill="#ffc36f" font-family="Georgia,serif" font-size="17">E₁</text>
  <text x="1040" y="419" fill="#ffc36f" font-family="Georgia,serif" font-size="17">E₂</text>
  <text x="963" y="429" text-anchor="middle" class="small">narrow pole</text>
  <text x="1060" y="442" text-anchor="middle" class="small">broader pole</text>
  <text x="1032" y="278" class="label">E<tspan baseline-shift="sub" font-size="11">res</tspan> = E<tspan baseline-shift="sub" font-size="11">r</tspan> − iΓ/2</text>

  <line x1="360" y1="545" x2="490" y2="545" stroke="#647f94" stroke-width="1" opacity="0.6"/>
  <line x1="710" y1="545" x2="840" y2="545" stroke="#647f94" stroke-width="1" opacity="0.6"/>
  <text x="600" y="551" text-anchor="middle" class="kicker">COMPUTATIONAL PHYSICS PORTFOLIO PROJECT</text>
  <text x="55" y="570" class="kicker" font-size="10">MODEL · SOLVE · ANALYZE · VISUALIZE</text>
  <text x="1145" y="570" text-anchor="end" class="kicker" font-size="10">PHYSICS · ALGORITHMS · INSIGHT</text>
</svg>
