[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-scattering-project"
version = "0.1.0"
description = "Reproducible one-dimensional quantum-scattering calculations from the lecture notes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "matplotlib>=3.8,<4",
  "pillow>=10,<13",
  "scipy>=1.13,<2",
]

[project.scripts]
quantum-scattering = "quantum_scattering.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
